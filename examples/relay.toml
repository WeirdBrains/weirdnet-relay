# weirdnet-relay example configuration (/etc/weirdnet-relay/relay.toml).
# Every key is optional; flags and WEIRDNET_RELAY_* environment variables override the file.

name = "Example Weirdnet relay"
operator = "Example Org"
# Shown on the info page; where abuse reports and questions go.
contact = "abuse@example.com"
description = "A public relay and bootstrap node for the Weirdnet network."

# Where relay.db (SQLCipher-encrypted: node key and peer table) lives.
# Default: $STATE_DIRECTORY (systemd StateDirectory=), else /var/lib/weirdnet-relay.
# state_dir = "/var/lib/weirdnet-relay"

# The database key: 64 hex characters (or 32 raw bytes) in a file.
# Default: the systemd credential `db-key` ($CREDENTIALS_DIRECTORY/db-key).
# db_key_file = "/etc/weirdnet-relay/db-key"

[network]
# TCP and QUIC on every interface (IPv4 and IPv6) when `listen` is empty.
port = 4747
# listen = ["/ip4/0.0.0.0/tcp/4747", "/ip4/0.0.0.0/udp/4747/quic-v1"]
# How others reach this relay, without /p2p/ (the relay adds its peer id).
external = ["/dns4/relay.example.com/tcp/4747", "/dns4/relay.example.com/udp/4747/quic-v1"]
# Other relays or bootstrap nodes, with /p2p/<peer id>: the WeirdBrains public relay.
bootstrap = [
  "/dns4/relay.net.weirdbrains.com/tcp/4747/p2p/12D3KooWHp56KezbVCubjuznJGqyn9xTe8PWePfuwv4YQUGxaRBB",
  "/dns4/relay.net.weirdbrains.com/udp/4747/quic-v1/p2p/12D3KooWHp56KezbVCubjuznJGqyn9xTe8PWePfuwv4YQUGxaRBB",
]
mdns = false

[limits]
# "unlimited" (the default: no caps on reservations, circuits, duration or bytes, and no
# rate limiters) or "libp2p" (libp2p's defaults: 2 minutes and 128 KiB per circuit).
preset = "unlimited"
# Any of these overrides the preset:
# max_reservations = 128
# max_reservations_per_peer = 4
# reservation_duration_secs = 3600
# max_circuits = 16
# max_circuits_per_peer = 4
# max_circuit_duration_secs = 120
# max_circuit_bytes = 0          # 0: no limit
# rate_limits = false

[http]
# The info page (HTML at /, JSON at /.well-known/weirdnet-relay.json, /healthz).
# Put a TLS reverse proxy in front of it to publish it.
enabled = true
listen = "127.0.0.1:4780"

[wss]
# WebSocket over TLS for clients on networks that only let HTTPS out (dialed as
# /dns4/<name>/tcp/<port>/tls/ws/p2p/<id>). Needs network.external set. Without cert and key
# the relay takes plain WebSocket on 127.0.0.1:<local_port> from a TLS reverse proxy that holds
# the certificate (DEPLOY.md has a Caddy example). With them it serves TLS itself, on `port`
# (ports below 1024 need the drop-in in DEPLOY.md), or on 127.0.0.1:<local_port> behind
# forwarding, which then shares 443 by server name. A renewed certificate takes a restart.
enabled = false
name = "relay.example.com"
# cert = "/run/credentials/weirdnet-relay.service/tls-cert"   # LoadCredential= (DEPLOY.md)
# key = "/run/credentials/weirdnet-relay.service/tls-key"
port = 443
local_port = 4743

[forwarding]
# Public HTTPS for Weirdnet hosts without a public address, by SNI passthrough: the relay
# reads only the server name, never holds a site's key or sees its traffic, and forwards a
# name only for a host with its owner's signed grant and a `_weirdnet.<name>` DNS binding.
# Port 80 passes ACME HTTP-01 for those names and redirects the rest to HTTPS.
# `weirdnet-relay revoke-site <name>` stops a site; `contact` above takes abuse reports.
enabled = false
https = "[::]:443"
http = "[::]:80"     # "" for none
# Names this machine serves itself, passed untouched (the info page's TLS proxy, say):
# local = { "relay.example.com" = "127.0.0.1:8443" }

[wake]
# The wake path for phones without APNs or FCM (F-Droid, sideloaded Android): devices that
# opted in keep a stream open on /weirdnet/wake/1, and trusted peers deliver sealed wake
# payloads here. The relay can't read them and keeps nothing on disk.
enabled = true
# Follow a push service's relay announcements too, so its wakes reach phones behind NAT:
# push = "https://push.weirdbrains.com"
# push_token_file = "/run/credentials/weirdnet-relay.service/push-token"   # `weirdnet-push relay-token`
max_subscribers = 100000
hold_secs = 120        # wakes wait this long for a phone that just dropped off
max_per_minute = 30    # per handle; more are dropped (battery protection)
keepalive_secs = 60

[updates]
# Update announcements on /weirdnet/updates/1: publishers publish signed announcements here,
# devices subscribe to the apps they run, and other relays follow. Only orgs listed in
# `roots` are carried, the latest per org, app and channel. Devices still check every
# announcement and update themselves; a relay can only withhold news, never forge it.
enabled = true
# roots = [
#   { pin = "<64 hex digits, as compiled into the org's apps>", chain = ["/etc/weirdnet-relay/roots/weirdbrains-1.root"] },
# ]
# Relays to follow, so announcements published there reach devices here:
# upstream = ["/dns4/relay.net.weirdbrains.com/tcp/4001/p2p/12D3Koo..."]
max_announcements = 10000
max_subscribers = 100000
keepalive_secs = 60

[ddns]
# Dynamic DNS through Grindvakt, for a relay you run on a home connection or a changing IP:
# keeps A/AAAA for the relay's name current, and `_dnsaddr.<name>` so peers dial
# /dnsaddr/<name>. Grindvakt never deletes records and changes nothing when the zone is
# ambiguous (two A records at the name, say). `weirdnet-relay ddns` shows the plan.
enabled = false
# provider = "digitalocean"   # or "dnsimple"
# token_file = "/run/credentials/weirdnet-relay.service/dns-token"   # the default: the `dns-token` credential
# dnsimple_account = 12345
# zone = "example.com"
# name = "relay"              # or "@" for example.com itself
ipv4 = true
ipv6 = true
dnsaddr = true
ttl = 300
interval_secs = 300
# Also list the name under [network] external, e.g. "/dns4/relay.example.com/tcp/4747".

[log]
format = "pretty"   # or "json"
level = "info"
