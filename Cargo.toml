[package]
name = "weirdnet-relay"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet relay and bootstrap node: libp2p circuit relay v2 with data-carrying circuits, Kademlia server, AutoNAT and hole-punch coordination on weirdnet-net, a node key in a SQLCipher database, and an info page (HTML and /.well-known/weirdnet-relay.json)."
authors = ["m3talsmith <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-relay"
homepage = "https://net.weirdbrains.com/relay"
readme = "README.md"
keywords = ["p2p", "libp2p", "relay", "weirdnet"]
categories = ["network-programming", "command-line-utilities"]
include = ["src/**", "README.md", "DEPLOY.md", "CHANGELOG.md", "LICENSE", "examples/relay.toml", "packaging/**", "assets/**"]

[lib]
name = "weirdnet_relay"

[[bin]]
name = "weirdnet-relay"
path = "src/main.rs"

[dependencies]
weirdnet-net = "=0.4.0"
weirdnet-storage = { version = "=0.1.0", default-features = false }
weirdnet-push = "=0.1.0"
futures = "0.3"
weirdnet-update = { git = "https://github.com/WeirdBrains/weirdnet-update", rev = "91b60f8ad526b6c4d6b876fdcac229fae64ccd34", features = ["wire"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
zeroize = "1"

[dev-dependencies]
weirdnet-push = { version = "=0.1.0", features = ["server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
rcgen = "0.13"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# `cargo deb` (cargo-deb 3): the .deb for Debian and Ubuntu servers. See DEPLOY.md.
[package.metadata.deb]
maintainer = "m3talsmith <m3talsmith@gmail.com>"
copyright = "2026, Weird Brains LLC"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto"
recommends = "systemd (>= 250)"
extended-description = """\
weirdnet-relay is a relay and bootstrap node for the Weirdnet network: a libp2p circuit \
relay v2 with no caps by default, a Kademlia server, AutoNAT and hole-punch coordination, \
a names server for signed peer records, and an info page. Its node key and state live in \
a SQLCipher database keyed from a systemd credential. The service starts only once that \
credential exists (see /usr/share/doc/weirdnet-relay/DEPLOY.md)."""
maintainer-scripts = "packaging/deb/"
conf-files = ["/etc/weirdnet-relay/relay.toml"]
assets = [
  ["target/release/weirdnet-relay", "usr/bin/", "755"],
  ["packaging/systemd/weirdnet-relay.service", "usr/lib/systemd/system/", "644"],
  ["packaging/relay.toml", "etc/weirdnet-relay/relay.toml", "644"],
  ["examples/relay.toml", "usr/share/doc/weirdnet-relay/examples/relay.toml", "644"],
  ["README.md", "usr/share/doc/weirdnet-relay/", "644"],
  ["DEPLOY.md", "usr/share/doc/weirdnet-relay/", "644"],
  ["CHANGELOG.md", "usr/share/doc/weirdnet-relay/", "644"],
]
