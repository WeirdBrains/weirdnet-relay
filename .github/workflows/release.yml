name: Release
# Builds the tar.gz, .deb, .rpm and Arch .pkg.tar.zst files (x86_64 and aarch64) for a release
# tag, install-tests them (Ubuntu with systemd, Fedora and Arch containers), creates the GitHub
# release with the shared release script (`weirdnet_release.py github`), then uploads the Arch
# recipe to TAUR when the TAUR_TOKEN secret is set. Runs on a pushed v* tag (made by
# `python3 scripts/weirdnet_release.py`) or by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an existing tag, without the v (e.g. 0.2.0)"
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35 (Debian 12 and Ubuntu 24.04 run it).
          - { runner: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        run: |
          V="${VERSION#v}"
          C=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "$V" = "$C" ] || { echo "::error::tag $V but Cargo.toml has $C"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - run: sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev
      - run: cargo install cargo-deb --locked
      - run: cargo build --locked --release
      - name: Package
        run: |
          cargo deb --no-build -o dist/
          packaging/tarball.sh "$V" ${{ matrix.arch }}
          ls -l dist
      - name: Install test
        run: |
          sudo apt-get install -y ./dist/weirdnet-relay_*_${{ matrix.deb }}.deb
          weirdnet-relay --version
          systemctl cat weirdnet-relay.service >/dev/null
          test -f /etc/weirdnet-relay/relay.toml
          T=$(mktemp -d); (umask 077; weirdnet-relay gen-key > "$T/key")
          weirdnet-relay --config /etc/weirdnet-relay/relay.toml --state-dir "$T/state" --db-key-file "$T/key" check-config
          # No db-key credential: the package must not have enabled or started the relay.
          if systemctl is-enabled --quiet weirdnet-relay.service; then echo "::error::enabled"; exit 1; fi
          if systemctl is-active --quiet weirdnet-relay.service; then echo "::error::started"; exit 1; fi
          sudo systemctl start weirdnet-relay.service
          if systemctl is-active --quiet weirdnet-relay.service; then echo "::error::started without db-key.cred"; exit 1; fi
          sudo apt-get purge -y weirdnet-relay
          if test -e /usr/bin/weirdnet-relay; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  # rpm and pkg.tar.zst for both arches from the tarballs (nothing is compiled), x86_64 install tests.
  packages:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build
        run: |
          V="${VERSION#v}"
          docker run --rm -v "$PWD:/src" -w /src fedora:latest sh -c "dnf install -y -q rpm-build && packaging/rpm/build.sh $V x86_64 aarch64"
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest sh -c "pacman -Syu --noconfirm --needed -q base-devel python && packaging/arch/build.sh $V x86_64 aarch64"
          sudo chown -R "$(id -u)" dist
          ls -l dist
      - name: Install test (Fedora, Arch)
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest packaging/test-install.sh rpm dist/weirdnet-relay-*.x86_64.rpm
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest packaging/test-install.sh arch dist/weirdnet-relay-*-x86_64.pkg.tar.zst
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest sh -c 'pacman -Qip dist/*-aarch64.pkg.tar.zst | grep -q "^Architecture *: aarch64"'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*-taur.tar.gz

  # The aarch64 rpm installs on ARM (there is no official arm64 archlinux image).
  packages-arm:
    needs: packages
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: dist
      - run: docker run --rm -v "$PWD:/src" -w /src fedora:latest packaging/test-install.sh rpm dist/weirdnet-relay-*.aarch64.rpm

  release:
    needs: [build, packages, packages-arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weirdnet_release.py github "${VERSION#v}"
      - name: Sign SHA256SUMS (minisign)
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::notice::MINISIGN_SECRET_KEY is not set; release files are not signed"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          TAG="v${VERSION#v}"
          gh release download "$TAG" -p SHA256SUMS -D sig
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m sig/SHA256SUMS -t "weirdnet-relay $TAG"
          rm -f "$RUNNER_TEMP/minisign.key"
          gh release upload "$TAG" sig/SHA256SUMS.minisig --clobber

  # The Arch recipe to TAUR (https://pkg.taur.weirdbrains.com) as the WeirdBrains org. Needs the
  # TAUR_TOKEN secret: a taurctl session token for an account in that org (sessions last 30 days).
  # Without it this is skipped; publish by hand: python3 scripts/weirdnet_release.py taur VERSION.
  taur:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Upload the recipe
        env:
          TAUR_TOKEN: ${{ secrets.TAUR_TOKEN }}
          TAUR_SERVER: https://pkg.taur.weirdbrains.com
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAUR_TOKEN" ]; then
            echo "::notice::TAUR_TOKEN is not set; upload the recipe with: python3 scripts/weirdnet_release.py taur ${VERSION#v}"
            exit 0
          fi
          # taurctl from a pinned TAUR release.
          T=taur-1.11.0-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/WeirdBrains/taur/releases/download/v1.11.0/$T"
          echo "434966750059e646b89e5dc3b24fd4db90435e2475901c7b379e7ed7a872a75e  $T" | sha256sum -c -
          tar -xzf "$T" taur-1.11.0/taurctl
          export PATH="$PWD/taur-1.11.0:$PATH" TAURCTL_CONFIG_DIR="$RUNNER_TEMP/taurctl"
          mkdir -m 700 "$TAURCTL_CONFIG_DIR"
          (umask 077; printf '%s' "$TAUR_TOKEN" > "$TAURCTL_CONFIG_DIR/token")
          python3 scripts/weirdnet_release.py taur "${VERSION#v}" --yes
