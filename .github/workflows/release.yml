name: Release
# Builds the .deb and tar.gz files for a release tag and creates the GitHub release with the
# shared release script (`weirdnet_release.py github`). Runs on a pushed v* tag (made by
# `python3 scripts/weirdnet_release.py`) or by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an existing tag, without the v (e.g. 0.2.0)"
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35 (Debian 12 and Ubuntu 24.04 run it).
          - { runner: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        run: |
          V="${VERSION#v}"
          C=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "$V" = "$C" ] || { echo "::error::tag $V but Cargo.toml has $C"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - run: sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev
      - run: cargo install cargo-deb --locked
      - run: cargo build --locked --release
      - name: Package
        run: |
          cargo deb --no-build -o dist/
          T=weirdnet-relay-$V-${{ matrix.arch }}-linux
          mkdir -p "$T/systemd"
          cp target/release/weirdnet-relay README.md DEPLOY.md CHANGELOG.md LICENSE examples/relay.toml "$T/"
          cp packaging/systemd/weirdnet-relay.service "$T/systemd/"
          tar -czf "dist/$T.tar.gz" "$T"
          ls -l dist
      - name: Install test
        run: |
          sudo apt-get install -y ./dist/weirdnet-relay_*_${{ matrix.deb }}.deb
          weirdnet-relay --version
          systemctl cat weirdnet-relay.service >/dev/null
          test -f /etc/weirdnet-relay/relay.toml
          T=$(mktemp -d); (umask 077; weirdnet-relay gen-key > "$T/key")
          weirdnet-relay --config /etc/weirdnet-relay/relay.toml --state-dir "$T/state" --db-key-file "$T/key" check-config
          # No db-key credential: the package must not have enabled or started the relay.
          if systemctl is-enabled --quiet weirdnet-relay.service; then echo "::error::enabled"; exit 1; fi
          if systemctl is-active --quiet weirdnet-relay.service; then echo "::error::started"; exit 1; fi
          sudo systemctl start weirdnet-relay.service
          if systemctl is-active --quiet weirdnet-relay.service; then echo "::error::started without db-key.cred"; exit 1; fi
          sudo apt-get purge -y weirdnet-relay
          if test -e /usr/bin/weirdnet-relay; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weirdnet_release.py github "${VERSION#v}"
      - name: Sign SHA256SUMS (minisign)
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::notice::MINISIGN_SECRET_KEY is not set; release files are not signed"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          TAG="v${VERSION#v}"
          gh release download "$TAG" -p SHA256SUMS -D sig
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m sig/SHA256SUMS -t "weirdnet-relay $TAG"
          rm -f "$RUNNER_TEMP/minisign.key"
          gh release upload "$TAG" sig/SHA256SUMS.minisig --clobber
